name: Test & Deploy

on:
  push:
    branches:
      - main
      - master
      - claude/poker-learning-app-concept-ml0xm6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: GitHub Pages konfigurieren
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build-Artefakt hochladen
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Hinweis, falls Pages noch nicht aktiviert ist
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages aktivieren::Einmalig unter Settings → Pages die Source 'GitHub Actions' wählen – danach deployt jeder Push automatisch."

  # Die neun Messläufe messen die gebaute App in einem echten Browser. Sie
  # laufen in einem eigenen Job, und der Deploy hängt bewusst NICHT daran:
  # Ein Browserlauf kann aus Gründen scheitern, die mit der App nichts zu tun
  # haben (Runner langsam, Browser-Download hakt), und dann soll trotzdem
  # veröffentlicht werden. Ein rotes Kreuz an diesem Job ist der Hinweis
  # zum Nachsehen — nicht der Schalter, der alles anhält.
  #
  # Enthalten sind die Läufe, die Struktur und Geometrie messen. `durchgang`
  # misst auch Zeiten und bleibt deshalb draußen: Auf einem geteilten Runner
  # wäre er die Sorte Prüfung, die man nach dem dritten Fehlalarm ignoriert.
  messungen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Browser holen
        # Playwright steht nicht in den devDependencies (siehe
        # scripts/browser.mjs) – hier wird es nur für diesen Job geholt.
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Bauen
        run: npm run build
      - name: Vorschau starten
        run: |
          # `--host 0.0.0.0` ist hier keine Kosmetik: Ohne Angabe lauscht die
          # Vorschau auf `localhost`, und das löst auf dem Runner zuerst nach
          # ::1 auf — der Server hört dann nur auf IPv6, während die Läufe
          # 127.0.0.1 ansprechen. Genau daran ist dieser Job 63 Läufe lang
          # gescheitert, ohne dass jemand hinsah (E-068). Beide Namen müssen
          # gehen: `ohnenetz` braucht 127.0.0.1 (auf `localhost` meldet sich
          # kein Service Worker an), die übrigen Läufe rufen `localhost`.
          nohup npm run preview -- --port 4173 --host 0.0.0.0 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          # Kommt sie nicht hoch, soll der Job hier scheitern und nicht in
          # sieben Läufen mit unverständlichen Zeitüberschreitungen.
          for name in 127.0.0.1 localhost; do
            curl -sf -o /dev/null "http://$name:4173/" \
              || { echo "Vorschau unter $name nicht erreichbar"; cat preview.log; exit 1; }
          done
      - name: Design (Kontrast, Größen, Farbmodi)
        run: npm run pruefen
      - name: Bedienbarkeit (Namen, Überschriften, Tastaturfokus)
        run: npm run bedienbar
      - name: Erreichbarkeit für den Daumen
        run: npm run daumen
      - name: Wege und Sackgassen
        run: npm run wege
      - name: Jeder Bildschirm ohne Netz
        run: npm run ohnenetz
      - name: Jeder Bildschirm ohne Gerätespeicher
        # Privates Fenster, gesperrte Website-Daten: Dann wirft schon der
        # Lesezugriff auf `localStorage`. Der Quelltext ist dagegen
        # abgesichert (`speichersperre.test.ts`) — dieser Lauf prüft, was
        # der Quelltext nicht zeigen kann: die Fremdbibliotheken.
        run: npm run speichersperre
      - name: Maße des Übungstisches
        run: npm run tisch
      - name: Ein Durchgang durch die App
        # 38 Schritte vom ersten Start bis zum abgerechneten Abend. Der
        # gründlichste Lauf des Projekts — und der einzige, dessen Ergebnis
        # bis E-070 nur so frisch war wie der letzte Aufruf von Hand.
        run: npm run durchgang
      - name: Das Handy quer
        # Alle anderen Läufe messen hochkant. Quer bleibt ein Fünftel der
        # Höhe — und niedrige Höhe bricht Layouts anders als schmale Breite.
        run: npm run quer
      - name: Java 21 einrichten
        # firebase-tools verlangt seit 15.x mindestens Java 21; der Runner
        # bringt von Haus aus eine ältere Fassung mit, und der Emulator
        # bricht mit „no longer supports Java version before 21" ab. In
        # E-060 stand „der Runner bringt Java mit" — richtig, aber das
        # falsche (E-071).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Sicherheitsregeln gegen den Emulator
        # Diese 29 Prüfungen sind aus `npm test` ausgeschlossen, weil sie
        # Java und den Firestore-Emulator brauchen — und liefen deshalb nur,
        # wenn jemand daran dachte. Sie sind die Zugriffsgrenze der Cloud:
        # unter anderem, dass niemand fremde Handkarten liest, nicht einmal
        # der Gastgeber. Der Runner bringt Java mit.
        run: npm run test:rules
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rechenwerkzeuge prüfen
        # Die 336 Tests unter `tools/poker-math` prüfen den Generator, der die
        # Zahlen der App erzeugt hat — Outs, Pot-Odds, Kombinatorik, die
        # Preflop-Matrix. Die App liest nur das Ergebnis; ohne diese Tests
        # prüft niemand mehr, wie es zustande kam. Sie liefen zuletzt nur,
        # wenn ein Mensch daran dachte (dieselbe Lage wie E-054 und E-060).
        run: |
          cd tools/poker-math
          pip install -q -r requirements.txt
          python -m pytest -q
      - name: Befunde zusammenfassen
        if: failure()
        # Ganz am Ende und kurz: Beim ersten wirklich gelaufenen Job stand
        # hier „docs/ohnenetz.json | 461 +++…", und was die 461 Zeilen
        # sagten, war nirgends zu lesen — der volle Diff wiederum ist so
        # lang, dass die Meldung des Laufs oben herausfällt.
        run: |
          node -e '
            const { readdirSync, readFileSync } = require("node:fs");
            for (const d of readdirSync("docs").filter((f) => f.endsWith(".json"))) {
              let j; try { j = JSON.parse(readFileSync("docs/" + d, "utf8")); } catch { continue; }
              const n = j.befunde_gesamt ?? (Array.isArray(j.befunde) ? j.befunde.length : null);
              if (n === null || n === 0) continue;
              console.log(`\n=== ${d}: ${n} Befunde ===`);
              console.log("Arten:", JSON.stringify(j.je_art ?? {}));
              for (const b of (j.befunde ?? []).slice(0, 8)) console.log("  ", JSON.stringify(b));
            }
          ' || true
      - name: Abweichungen zeigen
        if: failure()
        run: git --no-pager diff --stat docs/ || true

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
